name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  repository:
    name: repository checks
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate version and explicit release decision
        shell: bash
        run: |
          bash scripts/release-readiness.sh --check
          bash scripts/pilot-readiness.sh --check

      - name: Validate shell syntax
        shell: bash
        run: |
          bash -n \
            ./*.sh \
            scripts/*.sh \
            scripts/lib/*.sh \
            tests/*.sh \
            apps/personal-card/macos/*.sh

      - name: Validate Python hook syntax
        shell: bash
        run: |
          python3 -m py_compile \
            plugins/personal-model-context/scripts/context_hook.py \
            tests/fixtures/fake-persome-mcp.py

      - name: Test Personal Card contracts and browser flows
        working-directory: apps/personal-card
        shell: bash
        env:
          CHROME_PATH: /usr/bin/google-chrome
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm test
          npm run test:browser
          npm run test:production-browser
          npm run test:production-no-demo

      - name: Build and test the live GitHub release website
        working-directory: website
        shell: bash
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm test
          npm run lint

      - name: Lint shell scripts
        shell: bash
        run: |
          shellcheck -x \
            ./*.sh \
            scripts/*.sh \
            scripts/lib/*.sh \
            tests/*.sh \
            apps/personal-card/macos/*.sh

      - name: Lint GitHub Actions workflows
        shell: bash
        run: |
          actionlint_root="$(mktemp -d "${RUNNER_TEMP}/actionlint.XXXXXX")"
          actionlint_archive="actionlint_1.7.12_linux_amd64.tar.gz"
          curl \
            --fail \
            --location \
            --retry 3 \
            --retry-delay 2 \
            --retry-all-errors \
            --silent \
            --show-error \
            --output "${actionlint_root}/${actionlint_archive}" \
            "https://github.com/rhysd/actionlint/releases/download/v1.7.12/${actionlint_archive}"
          printf '%s  %s\n' \
            '8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8' \
            "${actionlint_root}/${actionlint_archive}" \
            | sha256sum --check
          tar -xzf \
            "${actionlint_root}/${actionlint_archive}" \
            -C "${actionlint_root}"
          "${actionlint_root}/actionlint" \
            .github/workflows/ci.yml \
            .github/workflows/release.yml \
            .github/workflows/pilot-gate.yml

      - name: Scan source and history for secrets
        shell: bash
        run: bash scripts/scan-secrets.sh --repository --self-test

      - name: Validate installer plan
        shell: bash
        run: |
          bash install.sh --print-plan
          bash update.sh --print-plan
          bash uninstall-runtime.sh --print-plan
          bash scripts/github-repository-controls.sh \
            --plan \
            --repository "${GITHUB_REPOSITORY}" \
            --release-actor user:release-owner \
            --release-reviewer team:release-reviewers

      - name: Verify pinned Runtime
        shell: bash
        run: bash scripts/validate-runtime-lock.sh

      - name: Build and validate self-contained production bundle
        shell: bash
        run: |
          version="$(tr -d '[:space:]' < VERSION)"
          package_name="who-am-i-${version}-self-contained-macos"
          output_directory="${RUNNER_TEMP}/self-contained-linux"
          extracted_directory="${RUNNER_TEMP}/self-contained-linux-extracted"

          bash scripts/build-self-contained-package.sh \
            --output-directory "${output_directory}"
          test -f "${output_directory}/${package_name}.tar.gz"
          test -f "${output_directory}/SHA256SUMS"
          test ! -e "${output_directory}/${package_name}.dmg"
          test "$(find "${output_directory}" -maxdepth 1 -type f | wc -l | tr -d ' ')" -eq 2
          (
            cd "${output_directory}"
            sha256sum --check SHA256SUMS
          )

          mkdir "${extracted_directory}"
          tar -xzf \
            "${output_directory}/${package_name}.tar.gz" \
            -C "${extracted_directory}"
          package_root="${extracted_directory}/${package_name}"
          (
            cd "${package_root}"
            sha256sum --check SELF-CONTAINED-SHA256SUMS
          )
          test ! -e "${package_root}/apps/personal-card/fixtures"
          test ! -e "${package_root}/apps/personal-card/tests"
          test ! -e "${package_root}/apps/personal-card/node_modules"
          test -d "${package_root}/runtime-source/.git"

          # Run the production-payload contract against the exact bundle.
          mkdir -p "${package_root}/apps/personal-card/tests/release"
          cp \
            apps/personal-card/tests/release/production-install-payload.test.mjs \
            "${package_root}/apps/personal-card/tests/release/"
          node --test \
            "${package_root}/apps/personal-card/tests/release/production-install-payload.test.mjs"

          # The embedded Runtime must be the reviewed lock, with no network
          # remote left for install-time source access.
          source scripts/lib/runtime-lock.sh
          runtime_lock_load runtime.lock
          test "$(git -C "${package_root}/runtime-source" rev-parse HEAD)" = \
            "${RUNTIME_COMMIT}"
          test "$(git -C "${package_root}/runtime-source" rev-parse 'HEAD^{tree}')" = \
            "${RUNTIME_TREE}"
          test -z "$(git -C "${package_root}/runtime-source" remote)"
          bash "${package_root}/install.sh" --print-plan

  macos:
    name: macOS prerequisites (${{ matrix.architecture }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            architecture: arm64
          - runner: macos-15-intel
            architecture: x86_64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Verify runner architecture
        shell: bash
        env:
          EXPECTED_ARCHITECTURE: ${{ matrix.architecture }}
        run: |
          actual_architecture="$(uname -m)"
          if [[ "${actual_architecture}" != "${EXPECTED_ARCHITECTURE}" ]]; then
            printf 'Expected %s, found %s.\n' \
              "${EXPECTED_ARCHITECTURE}" "${actual_architecture}" >&2
            exit 1
          fi

      - name: Validate shell syntax
        shell: bash
        run: |
          bash -n \
            ./*.sh \
            scripts/*.sh \
            scripts/lib/*.sh \
            tests/*.sh \
            apps/personal-card/macos/*.sh

      - name: Foundation regression tests
        shell: bash
        run: bash tests/foundation.sh

      - name: Verify host prerequisites
        shell: bash
        run: bash install.sh --check

      - name: Validate installer plan
        shell: bash
        run: bash install.sh --print-plan

      - name: Build universal native app launcher
        shell: bash
        run: |
          version="$(tr -d '[:space:]' < VERSION)"
          output_directory="${RUNNER_TEMP}/native-launcher"
          bash apps/personal-card/macos/build-native-launcher.sh \
            --product-root "${RUNNER_TEMP}/product-app/${version}" \
            --persome-root "${RUNNER_TEMP}/persome" \
            --product-version "${version}" \
            --output-directory "${output_directory}"
          app="${output_directory}/Who Am I.app"
          lipo "${app}/Contents/MacOS/WhoAmI" \
            -verify_arch arm64 x86_64
          codesign --verify --strict "${app}"
          test "$(
            plutil -extract WhoAmIProductVersion raw -o - \
              "${app}/Contents/Info.plist"
          )" = "${version}"

  macos-install:
    name: macOS isolated install (arm64)
    needs: repository
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Verify runner architecture
        shell: bash
        run: test "$(uname -m)" = "arm64"

      - name: Build, verify, and extract exact release assets
        id: self-contained-package
        shell: bash
        run: |
          version="$(tr -d '[:space:]' < VERSION)"
          package_name="who-am-i-${version}-self-contained-macos"
          output_directory="${RUNNER_TEMP}/release-assets"
          extracted_directory="${RUNNER_TEMP}/self-contained-macos-extracted"

          bash scripts/build-release-assets.sh \
            --repository "${GITHUB_REPOSITORY}" \
            --tag "v${version}" \
            --commit "$(git rev-parse HEAD)" \
            --source-ref HEAD \
            --output-directory "${output_directory}"
          test -f "${output_directory}/${package_name}.tar.gz"
          test -f "${output_directory}/${package_name}.dmg"
          test -f "${output_directory}/RELEASE-METADATA.txt"
          test -f "${output_directory}/RELEASE-NOTES.md"
          test -f "${output_directory}/SHA256SUMS"
          test "$(find "${output_directory}" -maxdepth 1 -type f | wc -l | tr -d ' ')" -eq 5
          (
            cd "${output_directory}"
            shasum -a 256 --check SHA256SUMS
            hdiutil verify "${package_name}.dmg"
          )

          mkdir "${extracted_directory}"
          tar -xzf \
            "${output_directory}/${package_name}.tar.gz" \
            -C "${extracted_directory}"
          package_root="${extracted_directory}/${package_name}"
          (
            cd "${package_root}"
            shasum -a 256 --check SELF-CONTAINED-SHA256SUMS
          )
          test -d "${package_root}/runtime-source/.git"

          source scripts/lib/runtime-lock.sh
          runtime_lock_load runtime.lock
          test "$(git -C "${package_root}/runtime-source" rev-parse HEAD)" = \
            "${RUNTIME_COMMIT}"
          test "$(git -C "${package_root}/runtime-source" rev-parse 'HEAD^{tree}')" = \
            "${RUNTIME_TREE}"
          test -z "$(git -C "${package_root}/runtime-source" remote)"
          printf 'product-root=%s\n' "${package_root}" >> "${GITHUB_OUTPUT}"

      - name: Foundation regression tests
        shell: bash
        run: bash tests/foundation.sh

      - name: Install, diagnose, and preserve-data uninstall from package
        shell: bash
        env:
          WHOAMI_SMOKE_PRODUCT_ROOT: ${{ steps.self-contained-package.outputs.product-root }}
        run: bash scripts/smoke-install.sh --uninstall-via-receipt
