name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  repository:
    name: repository checks
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate version and explicit release decision
        shell: bash
        run: |
          bash scripts/release-readiness.sh --check
          bash scripts/pilot-readiness.sh --check

      - name: Validate shell syntax
        shell: bash
        run: |
          bash -n \
            ./*.sh \
            scripts/*.sh \
            scripts/lib/*.sh \
            tests/*.sh \
            apps/personal-card/macos/*.sh

      - name: Validate Python hook syntax
        shell: bash
        run: |
          python3 -m py_compile \
            plugins/personal-model-context/scripts/context_hook.py \
            tests/fixtures/fake-persome-mcp.py

      - name: Test Personal Card contracts and browser flows
        working-directory: apps/personal-card
        shell: bash
        env:
          CHROME_PATH: /usr/bin/google-chrome
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm run typecheck
          npm run build:renderer
          npm test
          npm run test:electron-renderer
          npm run test:browser
          npm run test:production-browser
          npm run test:production-no-demo

      - name: Build and test the live GitHub release website
        working-directory: website
        shell: bash
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm test
          npm run lint

      - name: Lint shell scripts
        shell: bash
        run: |
          shellcheck -x \
            ./*.sh \
            scripts/*.sh \
            scripts/lib/*.sh \
            tests/*.sh \
            apps/personal-card/macos/*.sh

      - name: Lint GitHub Actions workflows
        shell: bash
        run: |
          actionlint_root="$(mktemp -d "${RUNNER_TEMP}/actionlint.XXXXXX")"
          actionlint_archive="actionlint_1.7.12_linux_amd64.tar.gz"
          curl \
            --fail \
            --location \
            --retry 3 \
            --retry-delay 2 \
            --retry-all-errors \
            --silent \
            --show-error \
            --output "${actionlint_root}/${actionlint_archive}" \
            "https://github.com/rhysd/actionlint/releases/download/v1.7.12/${actionlint_archive}"
          printf '%s  %s\n' \
            '8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8' \
            "${actionlint_root}/${actionlint_archive}" \
            | sha256sum --check
          tar -xzf \
            "${actionlint_root}/${actionlint_archive}" \
            -C "${actionlint_root}"
          "${actionlint_root}/actionlint" \
            .github/workflows/ci.yml \
            .github/workflows/release.yml \
            .github/workflows/pilot-gate.yml

      - name: Scan source and history for secrets
        shell: bash
        run: bash scripts/scan-secrets.sh --repository --self-test

      - name: Validate installer plan
        shell: bash
        run: |
          bash install.sh --print-plan
          bash update.sh --print-plan
          bash uninstall-runtime.sh --print-plan
          bash scripts/github-repository-controls.sh \
            --plan \
            --repository "${GITHUB_REPOSITORY}" \
            --release-actor user:release-owner \
            --release-reviewer team:release-reviewers

      - name: Verify pinned Runtime
        shell: bash
        run: bash scripts/validate-runtime-lock.sh

      - name: Require macOS for the distributable App bundle
        shell: bash
        run: |
          if bash scripts/build-self-contained-package.sh \
            --output-directory "${RUNNER_TEMP}/unexpected-macos-app"; then
            printf 'The macOS App builder unexpectedly ran on Linux.\n' >&2
            exit 1
          fi

  macos:
    name: macOS prerequisites (${{ matrix.architecture }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            architecture: arm64
          - runner: macos-15-intel
            architecture: x86_64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Verify runner architecture
        shell: bash
        env:
          EXPECTED_ARCHITECTURE: ${{ matrix.architecture }}
        run: |
          actual_architecture="$(uname -m)"
          if [[ "${actual_architecture}" != "${EXPECTED_ARCHITECTURE}" ]]; then
            printf 'Expected %s, found %s.\n' \
              "${EXPECTED_ARCHITECTURE}" "${actual_architecture}" >&2
            exit 1
          fi

      - name: Validate shell syntax
        shell: bash
        run: |
          bash -n \
            ./*.sh \
            scripts/*.sh \
            scripts/lib/*.sh \
            tests/*.sh \
            apps/personal-card/macos/*.sh

      - name: Foundation regression tests
        shell: bash
        run: bash tests/foundation.sh

      - name: Test native lifecycle boundaries
        shell: bash
        run: node --test apps/personal-card/tests/release/native-lifecycle.test.mjs

      - name: Verify host prerequisites
        shell: bash
        run: bash install.sh --check

      - name: Validate installer plan
        shell: bash
        run: bash install.sh --print-plan

      - name: Build the Persome Electron app
        working-directory: apps/personal-card
        shell: bash
        env:
          EXPECTED_ARCHITECTURE: ${{ matrix.architecture }}
        run: |
          npm ci --no-audit --no-fund
          npm run typecheck
          npm run test:electron-shell
          npm run pack:electron
          app="$(find dist -maxdepth 3 -type d -name 'Persome.app' -print -quit)"
          test -n "${app}"
          test -x "${app}/Contents/MacOS/Persome"
          test -f "${app}/Contents/Resources/product-installer/runtime.lock"
          test -f "${app}/Contents/Resources/product-installer/install.sh"
          test "$(lipo -archs "${app}/Contents/MacOS/Persome")" = \
            "${EXPECTED_ARCHITECTURE}"
          test "$(plutil -extract CFBundleIdentifier raw -o - \
            "${app}/Contents/Info.plist")" = "ai.intuition.persome"
          test "$(plutil -extract CFBundleShortVersionString raw -o - \
            "${app}/Contents/Info.plist")" = \
            "$(tr -d '[:space:]' < ../../VERSION)"

      - name: Build universal native app launcher
        shell: bash
        run: |
          version="$(tr -d '[:space:]' < VERSION)"
          output_directory="${RUNNER_TEMP}/native-launcher"
          bash apps/personal-card/macos/build-native-launcher.sh \
            --product-root "${RUNNER_TEMP}/product-app/${version}" \
            --persome-root "${RUNNER_TEMP}/persome" \
            --product-version "${version}" \
            --output-directory "${output_directory}"
          app="${output_directory}/Who Am I.app"
          lipo "${app}/Contents/MacOS/WhoAmI" \
            -verify_arch arm64 x86_64
          codesign --verify --strict "${app}"
          test "$(
            plutil -extract WhoAmIProductVersion raw -o - \
              "${app}/Contents/Info.plist"
          )" = "${version}"

          bootstrap_output="${RUNNER_TEMP}/native-bootstrap"
          bash apps/personal-card/macos/build-native-launcher.sh \
            --bootstrap \
            --product-version "${version}" \
            --output-directory "${bootstrap_output}"
          bootstrap_app="${bootstrap_output}/Who Am I.app"
          lipo "${bootstrap_app}/Contents/MacOS/WhoAmI" \
            -verify_arch arm64 x86_64
          codesign --verify --strict "${bootstrap_app}"
          test "$(
            plutil -extract WhoAmIBootstrapInstall raw -o - \
              "${bootstrap_app}/Contents/Info.plist"
          )" = "true"

  macos-install:
    name: macOS isolated install (arm64)
    needs: repository
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Verify runner architecture
        shell: bash
        run: test "$(uname -m)" = "arm64"

      - name: Build, verify, and extract exact release assets
        id: self-contained-package
        shell: bash
        run: |
          version="$(tr -d '[:space:]' < VERSION)"
          package_name="who-am-i-${version}-self-contained-macos"
          output_directory="${RUNNER_TEMP}/release-assets"
          extracted_directory="${RUNNER_TEMP}/self-contained-macos-extracted"

          bash scripts/build-release-assets.sh \
            --repository "${GITHUB_REPOSITORY}" \
            --tag "v${version}" \
            --commit "$(git rev-parse HEAD)" \
            --source-ref HEAD \
            --output-directory "${output_directory}"
          test -f "${output_directory}/${package_name}.tar.gz"
          test -f "${output_directory}/${package_name}.dmg"
          test -f "${output_directory}/RELEASE-METADATA.txt"
          test -f "${output_directory}/RELEASE-NOTES.md"
          test -f "${output_directory}/SHA256SUMS"
          test "$(find "${output_directory}" -maxdepth 1 -type f | wc -l | tr -d ' ')" -eq 5
          (
            cd "${output_directory}"
            shasum -a 256 --check SHA256SUMS
            hdiutil verify "${package_name}.dmg"
          )

          mkdir "${extracted_directory}"
          tar -xzf \
            "${output_directory}/${package_name}.tar.gz" \
            -C "${extracted_directory}"
          package_root="${extracted_directory}/${package_name}"
          (
            cd "${package_root}"
            shasum -a 256 --check SELF-CONTAINED-SHA256SUMS
          )
          app="${package_root}/Who Am I.app"
          product_root="${app}/Contents/Resources/product"
          test -d "${product_root}/runtime-source/.git"
          test -x "${product_root}/Install Who Am I.command"
          (
            cd "${product_root}"
            shasum -a 256 --check SELF-CONTAINED-SHA256SUMS
          )
          test -x "${app}/Contents/MacOS/WhoAmI"
          codesign --verify --deep --strict "${app}"
          lipo "${app}/Contents/MacOS/WhoAmI" \
            -verify_arch arm64 x86_64
          test "$(
            plutil -extract WhoAmIBootstrapInstall raw -o - \
              "${app}/Contents/Info.plist"
          )" = "true"
          grep -Fxq 'native_app_included=true' \
            "${package_root}/PACKAGE-METADATA.txt"
          grep -Fxq 'backend_embedded_in_app=true' \
            "${package_root}/PACKAGE-METADATA.txt"

          source scripts/lib/runtime-lock.sh
          runtime_lock_load runtime.lock
          test "$(git -C "${product_root}/runtime-source" rev-parse HEAD)" = \
            "${RUNTIME_COMMIT}"
          test "$(git -C "${product_root}/runtime-source" rev-parse 'HEAD^{tree}')" = \
            "${RUNTIME_TREE}"
          test -z "$(git -C "${product_root}/runtime-source" remote)"
          printf 'dmg-path=%s\n' \
            "${output_directory}/${package_name}.dmg" >> "${GITHUB_OUTPUT}"

      - name: Foundation regression tests
        shell: bash
        run: bash tests/foundation.sh

      - name: Install, diagnose, and preserve-data uninstall from mounted DMG
        shell: bash
        env:
          WHOAMI_DMG_PATH: ${{ steps.self-contained-package.outputs.dmg-path }}
        run: |
          mount_point="${RUNNER_TEMP}/whoami-mounted-dmg"
          mkdir "${mount_point}"
          hdiutil attach \
            -readonly \
            -nobrowse \
            -mountpoint "${mount_point}" \
            "${WHOAMI_DMG_PATH}"
          cleanup_mount() {
            hdiutil detach "${mount_point}" >/dev/null || true
          }
          trap cleanup_mount EXIT
          app="${mount_point}/Who Am I.app"
          product_root="${app}/Contents/Resources/product"
          test -x "${app}/Contents/MacOS/WhoAmI"
          test -x "${product_root}/Install Who Am I.command"
          codesign --verify --deep --strict "${app}"
          WHOAMI_SMOKE_PRODUCT_ROOT="${product_root}" \
            bash scripts/smoke-install.sh --uninstall-via-receipt
